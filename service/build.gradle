plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
	id 'jacoco'
	alias(libs.plugins.freefair.lombok)
}

group = 'fi.poltsi.vempain'
version = libs.versions.release.get()

bootJar {
	archiveFileName = "${rootProject.name}-${version}.jar"
}

description = 'Vempain Website public backend (Spring Boot rewrite of the PHP backend)'

java {
    sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
}

dependencies {
    implementation project(':api')
    implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Metrics are pushed over OTLP/HTTP to the monitoring host; see MetricsExportEnvironmentPostProcessor
    implementation 'io.micrometer:micrometer-registry-otlp'
    // Distributed tracing: W3C traceparent propagation, trace/span ids in every log line, spans pushed over OTLP/HTTP to Tempo
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    // Optional GeoLite2-Country lookup of the access log (vempain.site.geoip.database); the database itself is not shipped
    implementation "com.maxmind.geoip2:geoip2:${libs.versions.geoip2.get()}"
    implementation 'org.springframework.security:spring-security-crypto'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${libs.versions.springdoc.get()}"

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.micrometer:micrometer-tracing-test'
    // TraceContinuationCTC wires the OpenTelemetry bridge the way Boot does; the starter has it at runtime only
    testImplementation 'io.micrometer:micrometer-tracing-bridge-otel'
    testImplementation 'io.opentelemetry:opentelemetry-sdk'
	testImplementation "org.testcontainers:testcontainers-junit-jupiter:${libs.versions.testcontainers.get()}"
	testImplementation "org.testcontainers:testcontainers-postgresql:${libs.versions.testcontainers.get()}"
}

repositories {
	mavenCentral()
	maven {
		url = "https://maven.pkg.github.com/Vempain/vempain-auth"
		credentials {
			username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
			password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
		}
	}
	maven {
		url = "https://maven.pkg.github.com/Vempain/vempain-admin-backend-api"
		credentials {
			username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
			password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
		}
	}
	maven { url = 'https://repo.spring.io/milestone' }
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			element = 'PACKAGE'
			includes = ['fi.poltsi.vempain.file.service.files']
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.95
			}
		}
	}
}

tasks.named('test') {
    useJUnitPlatform()
    include '**/*UTC.class'
    include '**/*ITC.class'
    include '**/*CTC.class'
}

tasks.named('bootJar') {
    archiveFileName = 'vempain-website-backend.jar'
}
