plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.freefair.lombok)
    alias(libs.plugins.spring.dependency.management)
	id 'jacoco'
}

// The main class is declared so that the Boot plugin need not scan the compiled classes while configuring: that scan makes the
// compiled class directory a configuration input and a clean build can never reuse the configuration cache
springBoot {
    mainClass = 'fi.poltsi.vempain.website.VempainWebsiteApplication'
}

description = 'Vempain Website public backend (Spring Boot rewrite of the PHP backend)'

group = 'fi.poltsi.vempain'
version = libs.versions.release.get()

// Fixed name without the version: the Dockerfile copies this exact file into the image
bootJar {
    archiveFileName = "${rootProject.name}.jar"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/milestone' }
}

// Report deprecated API use and unchecked operations with their location instead of javac's "recompile with -Xlint" note, and fail the
// build on any of them (-Werror): deprecated 3rd-party functionality is replaced, never carried along; deliberate exceptions need an
// explicit @SuppressWarnings with a comment
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked', '-Werror']
}

// Versions without a catalog entry come from the Spring Boot BOM that the Boot plugin imports through the dependency-management plugin
dependencies {
    implementation project(':api')
    implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Metrics are pushed over OTLP/HTTP to the monitoring host; see MetricsExportEnvironmentPostProcessor
    implementation 'io.micrometer:micrometer-registry-otlp'
    // Distributed tracing: W3C traceparent propagation, trace/span ids in every log line, spans pushed over OTLP/HTTP to Tempo
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    // Optional GeoLite2-Country lookup of the access log (vempain.site.geoip.database); the database itself is not shipped
    implementation "com.maxmind.geoip2:geoip2:${libs.versions.geoip2.get()}"
    implementation 'org.springframework.security:spring-security-crypto'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${libs.versions.springdoc.get()}"
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.micrometer:micrometer-tracing-test'
    // TraceContinuationCTC wires the OpenTelemetry bridge the way Boot does; the starter has it at runtime only
    testImplementation 'io.micrometer:micrometer-tracing-bridge-otel'
    testImplementation 'io.opentelemetry:opentelemetry-sdk'
	testImplementation "org.testcontainers:testcontainers-junit-jupiter:${libs.versions.testcontainers.get()}"
	testImplementation "org.testcontainers:testcontainers-postgresql:${libs.versions.testcontainers.get()}"
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.named('test') {
    useJUnitPlatform()
    include '**/*UTC.class'
    include '**/*ITC.class'
    include '**/*CTC.class'
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			element = 'PACKAGE'
			includes = ['fi.poltsi.vempain.file.service.files']
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.95
			}
		}
	}
}
