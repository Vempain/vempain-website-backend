server:
  port: 8000
  # The frontend links to files whose names may contain characters that Tomcat rejects by
  # default; the PHP built-in server accepted them, so keep the behaviour.
  tomcat:
    relaxed-path-chars: "[,]"
    relaxed-query-chars: "[,]"

management:
  server:
    port: 8081

spring:
  application:
    name: vempain-website-backend
  datasource:
    url: override-me
    username: override-me
    password: override-me
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by the Vempain admin backend, never modified from here.
      ddl-auto: none
    properties:
      hibernate:
        default_schema: override-me
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: always

vempain:
  site:
    files-root: override-me
    jwt-secret: override-me
    jwt-ttl-seconds: 1200
    jwt-cookie-name: OXALATE_JWT_TOKEN
    jwt-cookie-secure: true
    cors-allowed-origins: override-me

logging:
  level:
    fi.poltsi.vempain.website: INFO

---
### Local machine ###

spring:
  config:
    activate:
      on-profile: local
    import: classpath:local.yaml

---
### Production server ###

spring:
  config:
    activate:
      on-profile: prod
    import: classpath:prod.yaml
