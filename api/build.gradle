plugins {
    id 'java-library'
    alias(libs.plugins.freefair.lombok)
    alias(libs.plugins.spring.dependency.management)
	id 'maven-publish'
	id 'jacoco'
}

description = 'Vempain Website REST API contracts and DTOs'

def apiArtifactName = "${rootProject.name}-api"

repositories {
    mavenCentral()
}

group = 'fi.poltsi.vempain'
version = libs.versions.release.get()

jar {
	archiveFileName = "${apiArtifactName}-${version}.jar"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
	// Attach sources and javadoc for Maven consumers
	withSourcesJar()
	withJavadocJar()
}

tasks.named('sourcesJar') {
	archiveFileName = "${apiArtifactName}-${version}-sources.jar"
}

tasks.named('javadocJar') {
	archiveFileName = "${apiArtifactName}-${version}-javadoc.jar"
}

// Quiet javadoc warnings as we're using Lombok which does not generate documentation for the generated methods
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:all,-missing', '-quiet') // keep other checks, ignore missing docs
}

// The Spring, Jakarta and Jackson artifacts below take their versions from the Spring Boot BOM
dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
    }
}

// Report deprecated API use and unchecked operations with their location instead of javac's "recompile with -Xlint" note, and fail the
// build on any of them (-Werror): deprecated 3rd-party functionality is replaced, never carried along; deliberate exceptions need an
// explicit @SuppressWarnings with a comment
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked', '-Werror']
}

dependencies {
    api 'org.springframework:spring-web'
    api 'jakarta.servlet:jakarta.servlet-api'
	// Jackson 3 (tools.jackson) naming strategies plus the com.fasterxml annotations that are still valid
	api 'org.springframework.boot:spring-boot-jackson'
	// Jakarta Validation constraints on the request DTOs and API parameters (validated by the service module)
	api 'jakarta.validation:jakarta.validation-api'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api "io.swagger.core.v3:swagger-annotations:${libs.versions.swagger.get()}"
	testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 no longer injects the JUnit Platform launcher; it must be on the test runtime classpath explicitly
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Publish the API module to GitHub Packages when invoked by CI
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			groupId = project.group
			artifactId = apiArtifactName
			version = project.version
			pom {
				name = apiArtifactName
				description = "Public API (DTOs and interfaces) for Vempain Website backend"
				url = "https://github.com/Vempain/${rootProject.name}"
				licenses {
					license {
						name = "GPL-2.0 License"
						url = "https://www.gnu.org/licenses/old-licenses/gpl-2.0.en.html"
					}
				}
				scm {
					url = "https://github.com/Vempain/${rootProject.name}"
				}
			}
		}
	}
	repositories {
		maven {
			name = "GitHubPackages"
			url = uri("https://maven.pkg.github.com/Vempain/${rootProject.name}")
			credentials {
				username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
				password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
			}
		}
	}
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.named('test') {
    useJUnitPlatform()
    include '**/*JTC.class'
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}
